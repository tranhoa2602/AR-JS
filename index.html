<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AR Demo</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --ar-button-display: none;
        background: #0b0c10;
      }
      .button-group {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(30px);
        display: flex;
        gap: 16px;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .button-group.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
      .button-group button {
        flex: 1;
        width: 160px;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s ease, filter 0.25s ease, box-shadow 0.2s ease;
        will-change: transform, filter, box-shadow;
        backdrop-filter: blur(12px);
      }
      .button-group button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      }
      .button-group button:active {
        transform: scale(0.95);
      }
      .ar-btn {
        background: linear-gradient(135deg, #ffd700, #ff8c00);
        color: #1a1a1a;
      }
      .link-btn {
        background: linear-gradient(135deg, #ff3b3b, #d81b60);
        color: #fff;
      }

      /* Nút icon chạy animation */
      #playAnim {
        position: absolute;
        bottom: 100px;
        right: 20px;
        width: 60px;
        height: 60px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        z-index: 20;
        transition: transform 0.2s ease, filter 0.25s ease;
      }
      #playAnim:hover {
        transform: scale(1.1);
        filter: brightness(1.2);
      }
      #playAnim:active {
        transform: scale(0.9);
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="mv"
      src="module/source/1M.glb"
      ios-src="module/source/1M.usdz"
      ar
      ar-modes="webxr quick-look"
      ar-scale="auto"
      ar-placement="floor"
      alt="BABY1M"
      scale="0.05 0.05 0.05"
      camera-controls
      camera-orbit="45deg 90deg 10m"
      touch-action="pan-x pan-y"
    >
    </model-viewer>

    <div class="button-group" id="btnGroup">
      <button class="ar-btn" id="customAR">
        <span class="btn-icon">🕶️</span> Xem AR
      </button>
      <button
        class="link-btn"
        id="visitBtn"
        onclick="window.open('https://store.epicgames.com/vi', '_blank')"
        style="display: none"
      >
        <span class="btn-icon">▶️</span> Ghé Thăm
      </button>
    </div>

    <!-- Nút icon chạy animation -->
    <button id="playAnim">🎬</button>

    <audio id="bgm" src="music/Sound-InPlace.MP3" preload="auto" loop></audio>

    <script>
      const mv = document.getElementById("mv");
      const customAR = document.getElementById("customAR");
      const playAnimBtn = document.getElementById("playAnim");
      const bgm = document.getElementById("bgm");
      const btnGroup = document.getElementById("btnGroup");
      const visitBtn = document.getElementById("visitBtn");
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      let firstAnim = null;

      // Nút kích hoạt AR
      customAR.addEventListener("click", async (event) => {
        event.preventDefault();
        try {
          await mv.activateAR();
        } catch (err) {
          console.log("Kích hoạt AR thất bại:", err);
        }

        if (isIOS && bgm.paused) {
          bgm.currentTime = 0;
          bgm
            .play()
            .catch((err) => console.log("Không phát được nhạc trên iOS:", err));
        }
      });

      // Xử lý âm thanh khi thoát AR hoặc ẩn trang
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          bgm.pause();
          bgm.currentTime = 0;
        }
      });

      mv.addEventListener("ar-status", (event) => {
        if (event.detail.status === "session-started") {
          bgm.currentTime = 0;
          bgm.play().catch((err) => console.log("Không phát được nhạc:", err));
        } else if (event.detail.status === "not-presenting") {
          bgm.pause();
          bgm.currentTime = 0;
          mv.cameraOrbit = "45deg 90deg 2m";
        }
      });

      window.addEventListener("pagehide", () => {
        bgm.pause();
        bgm.currentTime = 0;
      });

      mv.addEventListener("load", () => {
        const animations = mv.availableAnimations;

        if (animations && animations.length > 0) {
          firstAnim = animations[0];
          mv.animationName = firstAnim;
          mv.animationLoop = false;
          mv.pause(); // không chạy ngay
        } else {
          console.log("Không tìm thấy animation trong mô hình.");
        }

        btnGroup.classList.add("show");
        // ❌ Bỏ setTimeout 10s, chỉ hiện nút sau khi anim kết thúc
      });

      // Nút chạy animation bằng icon
      playAnimBtn.addEventListener("click", () => {
        if (!firstAnim) {
          alert("Model chưa có animation!");
          return;
        }

        mv.animationName = firstAnim;
        mv.animationLoop = false;
        mv.currentTime = 0;
        mv.play();

        // Theo dõi và dừng khi hết
        const lockAtEnd = () => {
          const duration = mv.duration;
          const currentTime = mv.currentTime;

          if (duration && currentTime >= duration - 0.1) {
            mv.pause();
            // ✅ hiện nút "Ghé Thăm"
            visitBtn.style.display = "flex";
            visitBtn.classList.add("show");
          } else {
            requestAnimationFrame(lockAtEnd);
          }
        };
        requestAnimationFrame(lockAtEnd);
      });
    </script>
  </body>
</html>
