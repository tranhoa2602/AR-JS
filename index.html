<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AR Demo</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --ar-button-display: none;
        background: #0b0c10;
      }
      .button-group {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        z-index: 10;
      }
      .button-group button {
        flex: 1;
        width: 160px;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s ease, filter 0.25s ease, box-shadow 0.2s ease;
        will-change: transform, filter, box-shadow;
        backdrop-filter: blur(12px);
      }
      .button-group button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      }
      .button-group button:active {
        transform: scale(0.95);
      }
      .ar-btn {
        background: linear-gradient(135deg, #ffd700, #ff8c00);
        color: #1a1a1a;
      }
      .link-btn {
        background: linear-gradient(135deg, #ff3b3b, #d81b60);
        color: #fff;
      }
      .btn-icon {
        font-size: 20px;
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <!-- iOS sẽ dùng GLB thay vì USDZ để có thể kiểm soát tốt hơn -->
    <model-viewer
      id="mv"
      src="module/source/1M.glb"
      ar
      autoplay
      ar-modes="quick-look"
      ar-scale="fixed"
      ar-placement="floor"
      alt="BABY1M"
      scale="0.01 0.01 0.01"
      camera-controls
      camera-orbit="0deg 90deg auto"
      disable-pan
    >
    </model-viewer>

    <div class="button-group">
      <button class="ar-btn" id="customAR">
        <span class="btn-icon">🕶️</span> Xem AR
      </button>
      <button
        class="link-btn"
        onclick="window.open('https://store.epicgames.com/vi', '_blank')"
      >
        <span class="btn-icon">▶️</span> Ghé Thăm
      </button>
    </div>

    <audio id="bgm" src="music/Sound-InPlace.MP3" preload="auto" loop></audio>

    <script>
      const mv = document.getElementById("mv");
      const customAR = document.getElementById("customAR");
      const bgm = document.getElementById("bgm");
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      // Cấu hình khác nhau cho từng platform
      function setupForPlatform() {
        if (isIOS) {
          console.log("Thiết lập cho iOS");
          // Thử nhiều cách tiếp cận cho iOS

          // Cách 1: Dùng GLB thay vì USDZ
          mv.removeAttribute("ios-src");

          // Cách 2: Thiết lập thuộc tính cụ thể cho iOS
          mv.setAttribute("ar-modes", "quick-look");
          mv.setAttribute("ar-scale", "fixed");
          mv.setAttribute("ar-placement", "floor");

          // Cách 3: CSS override
          mv.style.setProperty("--ar-distance", "1.5m");

          // Cách 4: Thử scale rất nhỏ
          mv.setAttribute("scale", "0.005 0.005 0.005");
        } else {
          console.log("Thiết lập cho Android");
          // Android hoạt động bình thường
          mv.setAttribute("ar-modes", "webxr scene-viewer");
          mv.setAttribute("ar-scale", "auto");
          mv.setAttribute("ar-placement", "floor");
          mv.setAttribute("scale", "0.1 0.1 0.1");
        }
      }

      // Chạy setup khi DOM ready
      setupForPlatform();

      // Nút mở AR
      customAR.addEventListener("click", async (event) => {
        event.preventDefault();

        if (isIOS) {
          // Thử force lại các thuộc tính trước khi mở AR
          mv.setAttribute("ar-scale", "fixed");
          mv.setAttribute("scale", "0.001 0.001 0.001");

          // Delay một chút để đảm bảo thuộc tính được apply
          setTimeout(async () => {
            try {
              await mv.activateAR();
            } catch (err) {
              console.log("Kích hoạt AR thất bại:", err);
            }
          }, 100);
        } else {
          try {
            await mv.activateAR();
          } catch (err) {
            console.log("Kích hoạt AR thất bại:", err);
          }
        }
      });

      // iOS xử lý nhạc khi mở AR
      if (isIOS) {
        customAR.addEventListener("click", () => {
          if (bgm.paused) {
            bgm.currentTime = 0;
            bgm
              .play()
              .catch((err) =>
                console.log("Không phát được nhạc trên iOS:", err)
              );
          }
        });

        // Khi thoát Quick Look → tab hiện lại → tắt nhạc
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            bgm.pause();
            bgm.currentTime = 0;
          }
        });

        // Thêm event listener cho AR status trên iOS
        mv.addEventListener("ar-status", (event) => {
          console.log("iOS AR Status:", event.detail.status);
          if (event.detail.status === "session-started") {
            console.log("AR started on iOS - scale should be applied");
          }
        });
      } else {
        // Android/WebXR
        mv.addEventListener("ar-status", (event) => {
          if (event.detail.status === "session-started") {
            // Ép model luôn spawn trước mặt
            mv.setAttribute("position", "0 0 -1.5");

            // Phát nhạc
            bgm.currentTime = 0;
            bgm
              .play()
              .catch((err) => console.log("Không phát được nhạc:", err));
          } else if (event.detail.status === "not-presenting") {
            // Thoát AR → tắt nhạc
            bgm.pause();
            bgm.currentTime = 0;
          }
        });
      }

      // Dự phòng: khi rời trang
      window.addEventListener("pagehide", () => {
        bgm.pause();
        bgm.currentTime = 0;
      });

      // Debug: Log các thuộc tính khi model load
      mv.addEventListener("load", () => {
        console.log("Model loaded");
        console.log("Current scale:", mv.getAttribute("scale"));
        console.log("Current ar-scale:", mv.getAttribute("ar-scale"));
        console.log("Current ar-placement:", mv.getAttribute("ar-placement"));
      });
    </script>
  </body>
</html>
