<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AR Demo - Fixed</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --ar-button-display: none;
        background: #0b0c10;
      }
      .button-group {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(30px);
        display: flex;
        gap: 16px;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .button-group.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
      .button-group button {
        flex: 1;
        width: 160px;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s ease, filter 0.25s ease, box-shadow 0.2s ease;
        will-change: transform, filter, box-shadow;
        backdrop-filter: blur(12px);
      }
      .button-group button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      }
      .button-group button:active {
        transform: scale(0.95);
      }
      .ar-btn {
        background: linear-gradient(135deg, #ffd700, #ff8c00);
        color: #1a1a1a;
      }
      .link-btn {
        background: linear-gradient(135deg, #ff3b3b, #d81b60);
        color: #fff;
      }
      .btn-icon {
        font-size: 20px;
        transform: translateY(1px);
      }
      .debug-info {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 100;
        display: none;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="mv"
      src="module/source/1M.glb"
      ios-src="module/source/1M.usdz"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      ar-placement="wall"
      alt="BABY1M"
      scale="1.0 1.0 1.0"
      camera-controls
      interaction-prompt="none"
      auto-rotate="false"
    >
    </model-viewer>

    <div class="debug-info" id="debugInfo">
      <div>AR Status: <span id="arStatus">Not active</span></div>
      <div>Device: <span id="deviceType"></span></div>
      <div>AR Modes: <span id="arModes"></span></div>
    </div>

    <div class="button-group" id="btnGroup">
      <button class="ar-btn" id="customAR">
        <span class="btn-icon">🕶️</span> Xem AR
      </button>
      <button class="ar-btn" id="debugBtn" style="display: none">
        <span class="btn-icon">🐛</span> Debug
      </button>
      <button
        class="link-btn"
        id="visitBtn"
        onclick="window.open('https://store.epicgames.com/vi', '_blank')"
        style="display: none"
      >
        <span class="btn-icon">▶️</span> Ghé Thăm
      </button>
    </div>

    <audio id="bgm" src="music/Sound-InPlace.MP3" preload="auto" loop></audio>

    <script>
      const mv = document.getElementById("mv");
      const customAR = document.getElementById("customAR");
      const bgm = document.getElementById("bgm");
      const btnGroup = document.getElementById("btnGroup");
      const visitBtn = document.getElementById("visitBtn");
      const debugBtn = document.getElementById("debugBtn");
      const debugInfo = document.getElementById("debugInfo");
      const arStatus = document.getElementById("arStatus");
      const deviceType = document.getElementById("deviceType");
      const arModes = document.getElementById("arModes");

      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isAndroid = /Android/i.test(navigator.userAgent);

      // Debug information
      deviceType.textContent = isIOS ? "iOS" : isAndroid ? "Android" : "Other";

      // Wait for model-viewer to be ready
      mv.addEventListener("load", () => {
        arModes.textContent = mv.arModes || "Not available";
      });

      // Debug button functionality
      debugBtn.addEventListener("click", () => {
        debugInfo.style.display =
          debugInfo.style.display === "none" ? "block" : "none";
      });

      // AR activation with better error handling
      customAR.addEventListener("click", async (event) => {
        event.preventDefault();

        try {
          // Check if AR is supported
          if (!mv.canActivateAR) {
            console.log("AR not supported on this device");
            alert("AR không được hỗ trợ trên thiết bị này");
            return;
          }

          console.log("Attempting to activate AR...");
          arStatus.textContent = "Starting...";

          await mv.activateAR();
          console.log("AR activated successfully");
        } catch (err) {
          console.error("AR activation failed:", err);
          arStatus.textContent = "Failed: " + err.message;

          // Fallback for different devices
          if (isAndroid) {
            console.log("Trying Android fallback...");
            // Force scene-viewer for Android
            mv.setAttribute("ar-modes", "scene-viewer");
            try {
              await mv.activateAR();
            } catch (fallbackErr) {
              console.error("Android fallback failed:", fallbackErr);
            }
          }
        }

        // Audio handling for iOS
        if (isIOS && bgm.paused) {
          bgm.currentTime = 0;
          bgm
            .play()
            .catch((err) => console.log("Audio playback failed on iOS:", err));
        }
      });

      // Enhanced AR status monitoring
      mv.addEventListener("ar-status", (event) => {
        const status = event.detail.status;
        arStatus.textContent = status;
        console.log("AR Status changed:", status);

        if (status === "session-started") {
          console.log("AR session started successfully");
          bgm.currentTime = 0;
          bgm.play().catch((err) => console.log("Audio playback failed:", err));
        } else if (status === "not-presenting") {
          console.log("AR session ended");
          bgm.pause();
          bgm.currentTime = 0;
        }
      });

      // Audio management
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          bgm.pause();
          bgm.currentTime = 0;
        }
      });

      window.addEventListener("pagehide", () => {
        bgm.pause();
        bgm.currentTime = 0;
      });

      // Model loading and animation setup
      mv.addEventListener("load", () => {
        console.log("Model loaded successfully");
        const animations = mv.availableAnimations;

        if (animations && animations.length > 0) {
          console.log("Available animations:", animations);
          mv.animationName = animations[0];
          mv.animationLoop = false;
          mv.play();

          const lockAtEnd = () => {
            const duration = mv.duration;
            const currentTime = mv.currentTime;

            if (duration && currentTime >= duration - 0.1) {
              mv.timeScale = 0.0;
            } else {
              requestAnimationFrame(lockAtEnd);
            }
          };

          requestAnimationFrame(lockAtEnd);
        } else {
          console.log("No animations found in the model");
        }

        // Show UI elements
        btnGroup.classList.add("show");

        // Show debug button in development
        if (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        ) {
          debugBtn.style.display = "flex";
        }

        // Show visit button after delay
        setTimeout(() => {
          visitBtn.style.display = "flex";
          visitBtn.classList.add("show");
        }, 10000);
      });

      // Error handling
      mv.addEventListener("error", (event) => {
        console.error("Model-viewer error:", event.detail);
      });
    </script>
  </body>
</html>
