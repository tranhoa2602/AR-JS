<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AR Camera Fixed Model</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        --ar-button-display: none; /* Ẩn nút mặc định */
        background: #0b0c10;
      }

      .button-group {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        z-index: 10;
      }

      .button-group button {
        flex: 1;
        width: 160px;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s ease, filter 0.25s ease, box-shadow 0.2s ease;
        will-change: transform, filter, box-shadow;
        backdrop-filter: blur(12px);
      }

      .button-group button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      }

      .button-group button:active {
        transform: scale(0.95);
      }

      .ar-btn {
        background: linear-gradient(135deg, #ffd700, #ff8c00);
        color: #1a1a1a;
      }

      .link-btn {
        background: linear-gradient(135deg, #4dd0ff, #1a73e8);
        color: #fff;
      }

      .btn-icon {
        font-size: 20px;
        transform: translateY(1px);
      }

      /* Thông báo */
      .notice {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 12px;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        font-size: 13px;
        line-height: 1.2;
        z-index: 20;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="mv"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
      ar
      autoplay
      camera-controls
      ar-modes="scene-viewer webxr quick-look"
      ar-scale="auto"
      ar-placement="floor"
      reveal="interaction"
      alt="3D Astronaut"
    >
    </model-viewer>

    <div class="button-group">
      <button class="ar-btn" id="customAR">
        <span class="btn-icon">🕶️</span> Xem AR
      </button>
      <button
        class="link-btn"
        onclick="window.open('https://teams.live.com/v2', '_blank')"
      >
        <span class="btn-icon">🌐</span> Ghé Thăm
      </button>
    </div>

    <div id="notice" class="notice hidden"></div>

    <script>
      const mv = document.getElementById("mv");
      const customAR = document.getElementById("customAR");
      const notice = document.getElementById("notice");

      function show(msg, ms = 2500) {
        notice.textContent = msg;
        notice.classList.remove("hidden");
        clearTimeout(show._t);
        show._t = setTimeout(() => notice.classList.add("hidden"), ms);
      }

      // Bắt sự kiện click nút AR
      customAR.addEventListener("click", () => {
        try {
          mv.activateAR();
        } catch (e) {
          console.log("Kích hoạt AR lỗi:", e);
          show("⚠️ Thiết bị không hỗ trợ AR hoặc lỗi kích hoạt.");
        }
      });

      // Log trạng thái AR
      mv.addEventListener("ar-status", (e) => {
        console.log("AR status:", e.detail.status);
        if (e.detail.status === "failed") {
          show("⚠️ Không thể mở AR. Kiểm tra ARCore / ARKit.");
        }
      });

      // Báo khi model không tải được
      mv.addEventListener("error", (e) => {
        console.warn("Model Viewer Error:", e.detail);
        show("⚠️ Lỗi tải model. Kiểm tra lại đường dẫn .glb / .usdz.");
      });
    </script>
  </body>
</html>
