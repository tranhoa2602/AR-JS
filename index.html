<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AR Demo</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --ar-button-display: none;
        background: #0b0c10;
      }
      .button-group {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        z-index: 10;
      }
      .button-group button {
        flex: 1;
        width: 160px;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s ease, filter 0.25s ease, box-shadow 0.2s ease;
        will-change: transform, filter, box-shadow;
        backdrop-filter: blur(12px);
      }
      .button-group button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      }
      .button-group button:active {
        transform: scale(0.95);
      }
      .ar-btn {
        background: linear-gradient(135deg, #ffd700, #ff8c00);
        color: #1a1a1a;
      }
      .link-btn {
        background: linear-gradient(135deg, #ff3b3b, #d81b60);
        color: #fff;
      }
      .btn-icon {
        font-size: 20px;
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="mv"
      src="module/source/1M.glb"
      ios-src="module/source/M1.usdz"
      ar
      autoplay
      ar-modes="quick-look"
      ar-scale="fixed"
      ar-placement="floor"
      alt="BABY1M"
      scale="0.05 0.05 0.05"
      camera-controls
      camera-orbit="0deg 75deg 2m"
      min-camera-orbit="auto auto 1m"
      max-camera-orbit="auto auto 5m"
      disable-pan
      shadow-intensity="1"
      shadow-softness="0.8"
    >
    </model-viewer>

    <div class="button-group">
      <button class="ar-btn" id="customAR">
        <span class="btn-icon">🕶️</span> Xem AR
      </button>
      <button
        class="link-btn"
        onclick="window.open('https://store.epicgames.com/vi', '_blank')"
      >
        <span class="btn-icon">▶️</span> Ghé Thăm
      </button>
    </div>

    <audio id="bgm" src="music/Sound-InPlace.MP3" preload="auto" loop></audio>

    <script>
      const mv = document.getElementById("mv");
      const customAR = document.getElementById("customAR");
      const bgm = document.getElementById("bgm");
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      // Thiết lập khác nhau cho iOS và Android
      if (isIOS) {
        // Cấu hình tối ưu cho iOS Quick Look
        mv.setAttribute("ar-scale", "fixed");
        mv.setAttribute("ar-placement", "floor");
        mv.setAttribute("scale", "0.03 0.03 0.03"); // Scale nhỏ hơn cho iOS

        // Đảm bảo model luôn ở trên sàn
        mv.style.setProperty("--ar-distance", "2m");
      } else {
        // Cấu hình cho Android WebXR
        mv.setAttribute("ar-scale", "auto");
        mv.setAttribute("ar-placement", "floor");
        mv.setAttribute("scale", "0.1 0.1 0.1");
      }

      // Nút mở AR
      customAR.addEventListener("click", async (event) => {
        event.preventDefault();
        try {
          await mv.activateAR();
        } catch (err) {
          console.log("Kích hoạt AR thất bại:", err);
        }
      });

      // iOS xử lý nhạc khi mở AR
      if (isIOS) {
        customAR.addEventListener("click", () => {
          if (bgm.paused) {
            bgm.currentTime = 0;
            bgm
              .play()
              .catch((err) =>
                console.log("Không phát được nhạc trên iOS:", err)
              );
          }
        });

        // Khi thoát Quick Look → tab hiện lại → tắt nhạc
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            bgm.pause();
            bgm.currentTime = 0;
          }
        });
      } else {
        // Android/WebXR
        mv.addEventListener("ar-status", (event) => {
          if (event.detail.status === "session-started") {
            // Đặt model trước mặt người dùng trên sàn
            mv.setAttribute("ar-placement", "floor");

            // Phát nhạc
            bgm.currentTime = 0;
            bgm
              .play()
              .catch((err) => console.log("Không phát được nhạc:", err));
          } else if (event.detail.status === "not-presenting") {
            // Thoát AR → tắt nhạc
            bgm.pause();
            bgm.currentTime = 0;
          }
        });
      }

      // Dự phòng: khi rời trang
      window.addEventListener("pagehide", () => {
        bgm.pause();
        bgm.currentTime = 0;
      });

      // Thêm event listener để đảm bảo model được đặt đúng vị trí
      mv.addEventListener("load", () => {
        if (isIOS) {
          // Đảm bảo model có kích thước phù hợp với iOS
          const bbox = mv.getBoundingBox();
          if (bbox) {
            const maxDim = Math.max(
              bbox.max.x - bbox.min.x,
              bbox.max.y - bbox.min.y,
              bbox.max.z - bbox.min.z
            );
            const targetSize = 0.5; // Kích thước mong muốn (mét)
            const scaleFactor = targetSize / maxDim;
            mv.setAttribute(
              "scale",
              `${scaleFactor} ${scaleFactor} ${scaleFactor}`
            );
          }
        }
      });
    </script>
  </body>
</html>
